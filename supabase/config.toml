project_id = "sgi-referral"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[auth]
enabled = true
site_url = "http://127.0.0.1:4174"
additional_redirect_urls = ["http://127.0.0.1:4174"]

[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"

# JWT checks happen with auth.getUser() inside each protected function, allowing current publishable keys.
# Provider webhooks use their own timestamped HMAC verification and need no user JWT.
[functions.create-checkout]
verify_jwt = false
[functions.sync-payment]
verify_jwt = false
[functions.submit-kyc]
verify_jwt = false
[functions.payment-webhook]
verify_jwt = false
[functions.kyc-webhook]
verify_jwt = false
